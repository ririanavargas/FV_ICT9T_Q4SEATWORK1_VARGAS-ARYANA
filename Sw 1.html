<body>

    <div class="container">
        <div class="row justify-content-center align-items-center mx-auto bg-info">
    <form>


                <h2>login</h2>
                <label for="UN" class="form-label"><b>Username</b></label>
                <br>
         <input type= "text" id="UN" class="form-control">
                <label for="Password" class="form-label"><b>Password</b></label>
                <br>
         <input type= "text" id="PW" class="form-control">
         <br>

         <div class="form-check">
         <input type= "checkbox" id="check" class="form-check-input" onclick="checker()"> <label for="check" class="form-label"><b>Stay logged in</b></label>
     </div>
         <br>
         <p id="display"> 
         </p>
         <input type= "button" id="login" class="btn btn-dark" onclick="checklogin()" value="login"> <input type= "reset" id="clear" class="btn btn-secondary" value="cancel">


</form>
</div>
</div>

<script>

    function checklogin(){
        let U=document.getElementById('UN').value;
        let P=document.getElementById('PW').value;


        if(U==="OBFV_VARGAS" && P==="Fairview"){
            alert("You have successfully logged in.");


        }
        else{
           alert("Incorrect login details."); 
        }
    }

    function checker() {
        let CB= document.getElementById("check").checked; 
         //when checked, it reads true

        switch(CB) {
            case true:
                document.getElementById("display").innerHTML="Remember me";
            break;

            case false:
                document.getElementById("display").innerHTML="";
            break;

           
 }
}
</script>
